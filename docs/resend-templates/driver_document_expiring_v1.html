<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document expiring</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:560px;background:#ffffff;border-radius:12px;padding:36px 28px;">
            <tr>
              <td>
                <p style="margin:0 0 16px;font-size:18px;font-weight:600;color:#0f172a;">Hi {{{driver_first_name}}}</p>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#334155;">
                  {{{headline}}}
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;color:#1e293b;margin-bottom:20px;">
                  <tr><td style="padding:6px 0;color:#64748b;">Document</td><td style="padding:6px 0;text-align:right;font-weight:600;">{{{document_label}}}</td></tr>
                  <tr><td style="padding:6px 0;color:#64748b;">Expires</td><td style="padding:6px 0;text-align:right;">{{{expiry_date}}}</td></tr>
                  <tr><td style="padding:6px 0;color:#64748b;">Days left</td><td style="padding:6px 0;text-align:right;">{{{days_left}}}</td></tr>
                </table>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#334155;">
                  {{{body_text}}}
                </p>
                <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#64748b;">
                  Open the Vantage Lane driver app → <strong>Documents</strong> to renew.
                </p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#64748b;border-top:1px solid #e2e8f0;padding-top:16px;">
                  Support: <a href="mailto:{{{support_email}}}" style="color:#2563eb;">{{{support_email}}}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
